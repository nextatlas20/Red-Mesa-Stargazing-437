name: Publish SKY-437

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish SKY-437 files
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/sky437_publish.py /tmp/sky437_publish.py
          git config user.name "SKY-437 Publisher"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/academicpages/academicpages.github.io.git 2>/dev/null || git remote set-url upstream https://github.com/academicpages/academicpages.github.io.git
          git fetch upstream master
          git checkout -B master FETCH_HEAD
          python3 /tmp/sky437_publish.py
          git status --short
          git add -A
          git commit -m "Publish Red Mesa stargazing bookings"
          git push --force origin master
